<html lang="en"><head><meta charset="utf-8">

<title>Focus</title>

<style>
:root{color-scheme:dark;--bg:#121212;--fg:#E4E4E4;--dim:#8D8D8D;--line:#353535;--f:#E4E4E4;--b:#8D8D8D;--nav:#151515;--th:#E4E4E4;--sh:rgba(0,0,0,.5);--thsh:rgba(0,0,0,.55);--don:#E4E4E4;--doff:#2d2d2d;
 --rs:max(200px,min(calc(100vw - 56px),420px,calc(100dvh - 285px)));
 box-sizing:border-box;padding-top:var(--sat,env(safe-area-inset-top,0px));padding-bottom:var(--sab,env(safe-area-inset-bottom,0px))}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
/* light theme: soft grey background, the dark-mode black (#0d0d0d) as ink, never pure white */
:root[data-theme=light]{color-scheme:light;--bg:#ececec;--fg:#0d0d0d;--dim:#5e5e5e;--line:#d4d4d4;--f:#0d0d0d;--b:#5e5e5e;--nav:#e0e0e0;--th:#0d0d0d;--sh:rgba(0,0,0,.12);--thsh:rgba(0,0,0,.25);--don:#0d0d0d;--doff:#d6d6d6}
/* custom themes: official palettes (dark variants). bg/fg/accent/surfaces from each theme; text pairs are all >= 4.5:1 */
[data-theme=gruvbox]{color-scheme:dark;--bg:#282828;--fg:#ebdbb2;--dim:#a89984;--line:#504945;--f:#fabd2f;--b:#a89984;--nav:#1d2021;--th:#fabd2f;--sh:rgba(0,0,0,.5);--thsh:rgba(0,0,0,.55);--don:#ebdbb2;--doff:#3c3836}
[data-theme=tokyo]{color-scheme:dark;--bg:#1a1b26;--fg:#c0caf5;--dim:#9aa5ce;--line:#3b4261;--f:#7aa2f7;--b:#9aa5ce;--nav:#16161e;--th:#7aa2f7;--sh:rgba(0,0,0,.5);--thsh:rgba(0,0,0,.55);--don:#c0caf5;--doff:#292e42}
[data-theme=nord]{color-scheme:dark;--bg:#2e3440;--fg:#eceff4;--dim:#d8dee9;--line:#4c566a;--f:#88c0d0;--b:#d8dee9;--nav:#3b4252;--th:#88c0d0;--sh:rgba(0,0,0,.35);--thsh:rgba(0,0,0,.4);--don:#eceff4;--doff:#3b4252}
[data-theme=everforest]{color-scheme:dark;--bg:#2d353b;--fg:#d3c6aa;--dim:#9da9a0;--line:#475258;--f:#a7c080;--b:#9da9a0;--nav:#232a2e;--th:#a7c080;--sh:rgba(0,0,0,.45);--thsh:rgba(0,0,0,.5);--don:#d3c6aa;--doff:#3d484d}
button:focus-visible,input:focus-visible{outline:2px solid var(--f);outline-offset:3px}
svg{display:block}
#app{height:100%;display:flex;flex-direction:column;padding-left:var(--sal,env(safe-area-inset-left,0px));padding-right:var(--sar,env(safe-area-inset-right,0px))}
.view{flex:1;display:none;min-height:0;overflow-y:auto;padding:24px 28px}
.view.on{display:flex;flex-direction:column;animation:vin .3s cubic-bezier(.2,.8,.2,1)}
@keyframes vin{from{opacity:0;transform:translateX(var(--dx,0px))}to{opacity:1;transform:none}}

#vs>*,#vg>*{width:100%;max-width:560px;margin-left:auto;margin-right:auto}
#vg>*,#vs>*{flex:none}
#vg{padding-bottom:16px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}

/* timer view */
#vt{align-items:center;justify-content:center;gap:28px;overflow:visible}
#stage{width:var(--rs);aspect-ratio:1;flex:none}
:root{--sat:var(--sat-p,env(safe-area-inset-top,0px));--sab:var(--sab-p,env(safe-area-inset-bottom,0px));--sal:var(--sal-p,env(safe-area-inset-left,0px));--sar:var(--sar-p,env(safe-area-inset-right,0px))}
@media (orientation:landscape){:root{--sat:var(--sat-l,env(safe-area-inset-top,0px));--sab:var(--sab-l,env(safe-area-inset-bottom,0px));--sal:var(--sal-l,env(safe-area-inset-left,0px));--sar:var(--sar-l,env(safe-area-inset-right,0px))}}
.ring.rot{transition:none!important}
.ring{position:relative;width:100%;height:100%;cursor:pointer;
 transform:translate3d(var(--dx,0px),var(--dy,0px),0) scale(var(--s,1));transition:transform .75s cubic-bezier(.22,1,.36,1);will-change:transform}
#time{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}

#go{font-size:18px;padding:14px 38px;border:1px solid var(--dim);border-radius:99px}
.sm{color:var(--dim);font-size:15px;padding:12px 6px}
.running #ctl,.running nav{opacity:0;visibility:hidden}
.running #lab{opacity:.5}

/* nav */
nav{display:flex;gap:6px;margin:0 16px 12px;padding:6px;background:var(--nav);border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 24px var(--sh)}
nav button{flex:1;color:var(--dim);padding:10px 0 9px;font-size:11px;letter-spacing:.02em;display:flex;flex-direction:column;align-items:center;gap:4px;border-radius:14px;transition:color .2s,background-color .2s}

nav{position:relative}nav button{position:relative;z-index:1}
#pill{position:absolute;left:0;top:0;z-index:0;border-radius:14px;background:var(--fg);pointer-events:none;will-change:transform}
#pill.an{transition:transform .38s cubic-bezier(.4,0,.2,1),width .38s cubic-bezier(.4,0,.2,1),height .38s cubic-bezier(.4,0,.2,1)}
@media (prefers-reduced-motion:reduce){#pill.an{transition:none}}
nav button.on svg{stroke-width:2}

h2{font-weight:300;font-size:15px;color:var(--dim);margin:6px 0 14px}
.big{font-size:56px;font-weight:200;letter-spacing:-.02em}
.bar{height:3px;background:var(--line);border-radius:3px;overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;background:var(--f);border-radius:3px}
.mut{color:var(--dim);font-size:14px}
.row{display:grid;grid-template-columns:84px 1fr 62px;gap:12px;align-items:center;padding:9px 0;font-size:14px}
.row .t{text-align:right;font-variant-numeric:tabular-nums}
.row .bar{margin:0}
.grp{margin-bottom:26px}
.grp h2,.lb{display:flex;align-items:center;gap:10px}
.lb svg{width:20px;height:20px;color:var(--dim);stroke-width:1.6;flex:none}
.grp h2 svg{width:18px;height:18px;stroke-width:1.6}
.chips{display:flex;gap:10px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:99px;padding:10px 18px;font-size:15px;color:var(--dim)}
.chip.on{border-color:var(--f);color:var(--fg)}
.sl{display:flex;justify-content:space-between;align-items:center;margin:16px 0 6px;font-size:15px}
.sl #fv,.sl #bv,.sl #gv{font-variant-numeric:tabular-nums;color:var(--dim)}

/* sliders: thick pill track, rounded-rectangle thumb */
input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:36px;margin:0;background:transparent;
 --p:calc(7px + (100% - 14px)*var(--k,0));--rm:var(--line);--rm:color-mix(in srgb,var(--f) 32%,transparent)}
input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:5px;background:linear-gradient(to right,var(--f) var(--p),var(--rm) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:32px;border-radius:5px;background:var(--f);margin-top:-11px;box-shadow:0 1px 5px var(--thsh);transition:transform .15s}
input[type=range]:active::-webkit-slider-thumb{transform:scaleX(.85)}
input[type=range]::-moz-range-track{height:10px;border-radius:5px;background:var(--rm)}
input[type=range]::-moz-range-progress{height:10px;border-radius:5px;background:var(--f)}
input[type=range]::-moz-range-thumb{width:14px;height:32px;border:0;border-radius:5px;background:var(--f)}
.ticks{position:relative;height:30px;margin-top:-2px}
.ticks i{position:absolute;top:0;width:0;left:calc(7px + (100% - 14px)*var(--k))}
.ticks i::before{content:"";position:absolute;left:-1px;top:0;width:2px;height:6px;border-radius:1px;background:var(--dim);opacity:.6}
.ticks b{position:absolute;top:10px;left:0;transform:translateX(-50%);font-size:11px;font-weight:400;color:var(--dim);font-variant-numeric:tabular-nums}

/* landscape: nav becomes a side rail, timer + controls sit side by side */
@media (orientation:landscape){
 :root{--rs:max(160px,min(calc(100dvh - 56px),46vw,440px))}
 #app{flex-direction:row}
 nav{order:-1;flex-direction:column;align-self:center;margin:0 0 0 12px}
 nav button{flex:none;width:68px}
 .view{padding:20px 28px}
 #vt{flex-direction:row;gap:clamp(24px,6vw,64px)}
 #ctl{flex-direction:column;gap:14px;min-width:120px}
 #lab{position:absolute;left:0;right:0;margin:0;padding-top:16px;text-align:center;top:calc(50% + var(--rs)*.14);transform-origin:50% 0;transform:scale(calc(1/var(--s,1)));transition:opacity .3s,transform .75s cubic-bezier(.22,1,.36,1)}
 [data-cs=tetris] #lab{top:calc(50% + var(--hh,calc(var(--rs)*.14)))}
}
#sk.h,#rs.h{visibility:hidden}
.tg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.tg[hidden]{display:none}
.tg3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tc{position:relative;display:flex;flex-direction:column;gap:12px;align-items:flex-start;padding:12px 10px;border-radius:14px;background:var(--cb,var(--bg));color:var(--cf,var(--fg));border:2px solid var(--line);text-align:left;min-width:0}
.tc.on{border-color:var(--f)}
.tn{display:flex;align-items:center;gap:6px;font-size:14px;opacity:.85;max-width:100%;white-space:nowrap}
.tn svg{width:16px;height:16px;flex:none}
.dots{display:flex}
.dots i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(128,128,128,.45);margin-left:-4px}
.dots i:first-child{margin-left:0}
.ck{position:absolute;top:-8px;right:-8px;width:20px;height:20px;border-radius:50%;background:var(--f);color:var(--bg);display:flex;align-items:center;justify-content:center;transform:scale(0);transition:transform .2s}
.ck svg{width:12px;height:12px;stroke-width:3}
.tc.on .ck{transform:scale(1)}
.ch{display:inline-block;white-space:pre}
.ch.u{animation:chu .14s ease-out}
.ch.d{animation:chd .14s ease-out}
@keyframes chu{from{transform:translateY(35%);opacity:.2}to{transform:none;opacity:1}}
@keyframes chd{from{transform:translateY(-35%);opacity:.2}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.ch.u,.ch.d{animation:none}}

/* settings cards */
.cd{border:1px solid var(--line);border-radius:14px;background:var(--nav);padding:14px;margin-bottom:14px}
#vg>.cd:last-child{margin-bottom:0}
.hd{display:flex;align-items:center;gap:12px;width:100%;padding:0;margin:0;text-align:left}
.ib{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;border:0;background:color-mix(in srgb,var(--fg) 14%,var(--nav));color:var(--fg);flex:none}
.ib svg{width:20px;height:20px;stroke-width:1.6}
.ht{display:flex;flex-direction:column;gap:2px;flex:1;min-width:0}.ht b{font-size:17px;font-weight:600}.ht small{font-size:13px;color:var(--dim)}
.cv{color:var(--f);display:flex;transition:transform .2s}.cv svg{width:22px;height:22px}
.cd.cl .cv{transform:rotate(180deg)}
.bd{display:grid;grid-template-rows:1fr;margin-top:14px;opacity:1;transition:grid-template-rows .32s cubic-bezier(.4,0,.2,1),margin-top .32s cubic-bezier(.4,0,.2,1),opacity .24s ease .08s}
.bi{overflow:hidden;min-height:0;padding:10px;margin:-10px}
.cd.cl .bd{grid-template-rows:0fr;margin-top:0;opacity:0;visibility:hidden;transition:grid-template-rows .32s cubic-bezier(.4,0,.2,1),margin-top .32s cubic-bezier(.4,0,.2,1),opacity .18s ease,visibility 0s .32s}
@media (prefers-reduced-motion:reduce){.bd,.cd.cl .bd,.cv{transition:none}}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:6px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.chip{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:0;border-radius:9px;padding:14px 4px;color:var(--dim)}
.chip b{font-size:16px}.chip span{font-size:12px;opacity:.85}
.chip.on{background:var(--f);color:var(--bg)}
.sr{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:16px}
.sr .lb{gap:12px;flex:1;min-width:0}.sr .ht small{font-size:12px}.stp{flex:none}
.stp{display:flex;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--bg);overflow:hidden}
.stp .sb{width:42px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--f)}
.stp .sb svg{width:20px;height:20px}.stp .sb{touch-action:manipulation;-webkit-touch-callout:none}.stp .sb:active{background:var(--line)}
.stp>span{min-width:64px;text-align:center;font-size:16px;white-space:nowrap;font-variant-numeric:tabular-nums}
.sl{justify-content:flex-end;margin:0 0 4px}
#tm{display:flex;gap:6px;padding:6px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
#tm .tc{flex:1;flex-direction:row;justify-content:center;align-items:center;gap:8px;padding:12px 6px;border:0;border-radius:9px;background:none;color:var(--dim);font-size:15px;font-weight:600}
#tm .tc svg{width:18px;height:18px;min-width:18px;flex:none}
#tm .tc{white-space:nowrap;min-width:min-content;flex:1 1 0;gap:6px;padding:12px 8px;font-size:clamp(12px,3.7vw,15px)}
#tm .tc svg{width:clamp(15px,4.4vw,18px);height:clamp(15px,4.4vw,18px);min-width:0}
#tm .tc.on{background:var(--f);color:var(--bg)}
#tm,#chips{position:relative}#tm .tc,#chips .chip{position:relative;z-index:1;transition:color .2s}
#tm .tc.on,#chips .chip.on{background:none}
.sp{position:absolute;left:0;top:0;z-index:0;border-radius:9px;background:var(--f);pointer-events:none;will-change:transform}
.sp.an{transition:transform .38s cubic-bezier(.4,0,.2,1),width .38s cubic-bezier(.4,0,.2,1),height .38s cubic-bezier(.4,0,.2,1)}
@media (prefers-reduced-motion:reduce){.sp.an{transition:none}}

@media (max-width:360px){.ib{width:36px;height:36px}.ht b{font-size:16px}.stp>span{min-width:54px}.stp .sb{width:36px}.tg{grid-template-columns:1fr}}

@font-face{font-family:FlipDigits;src:url(fonts/flip-digits.woff2) format("woff2");font-weight:700;font-style:normal;font-display:block}
/* clock styles: flip clock + long-press picker */
#fxc{display:none}[data-cs=flip] #cv{display:none}[data-cs=flip] #fxc{display:flex}
[data-cs=flip] .ring{will-change:auto}
.ring{-webkit-touch-callout:none}
.fxd:nth-child(3){margin-left:2em}
.fxc{display:flex;gap:2em;width:100%;aspect-ratio:100/28;font-size:calc(var(--w,var(--rs))/100)}
.fxd{position:relative;flex:1 1 0;perspective:90em}
.fxd>div{position:absolute;left:0;right:0;height:50%;overflow:hidden}
.fxu,.fxa{top:0;border-radius:2.6em 2.6em 1em 1em;background:var(--doff);background:linear-gradient(180deg,color-mix(in srgb,var(--doff) 84%,#fff),var(--doff))}
.fxl,.fxb{top:50%;border-radius:1em 1em 2.6em 2.6em;background:var(--doff);background:linear-gradient(180deg,color-mix(in srgb,var(--doff) 93%,#000),color-mix(in srgb,var(--doff) 80%,#000))}
.fxd i{position:absolute;left:0;right:0;height:200%;display:flex;align-items:center;justify-content:center;font:normal 700 24em/1 FlipDigits,Arial,Helvetica,sans-serif;font-variant-numeric:tabular-nums;color:var(--f);-webkit-text-stroke:.025em currentColor}
.fxu i,.fxa i{top:0}.fxu i,.fxa i{color:color-mix(in srgb,var(--f) 84%,#fff)}.fxl i,.fxb i{bottom:0}
.fxa,.fxb{z-index:2;visibility:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.fxa{transform-origin:50% 100%}.fxb{transform-origin:50% 0;transform:rotateX(90deg)}
.fxa::after,.fxb::after{content:"";position:absolute;inset:0;background:#000;opacity:0}
.fxd::after{content:"";position:absolute;left:0;right:0;top:calc(50% - .17em);height:.34em;background:var(--bg);z-index:5}
.fxd.go .fxa,.fxd.go .fxb{visibility:visible}
.fxd.go .fxa{animation:fxA .25s cubic-bezier(.45,0,.85,.55) both}
.fxd.go .fxa::after{animation:fxS .25s linear both}
.fxd.go .fxb{animation:fxB .3s cubic-bezier(.15,.7,.3,1) .25s both}
.fxd.go .fxb::after{animation:fxT .3s linear .25s both}
@keyframes fxA{from{transform:rotateX(0)}to{transform:rotateX(-90deg)}}
@keyframes fxB{from{transform:rotateX(90deg)}to{transform:rotateX(0)}}
@keyframes fxS{from{opacity:0}to{opacity:.55}}
@keyframes fxT{from{opacity:.55}to{opacity:0}}
#pk{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
#pk.on{opacity:1;visibility:visible}
.pkb{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.pks{position:relative;width:100%;max-width:560px;background:var(--nav);border:1px solid var(--line);border-bottom:0;border-radius:24px 24px 0 0;padding:10px 0 calc(22px + var(--sab,env(safe-area-inset-bottom,0px)));transform:translateY(100%);transition:transform .35s cubic-bezier(.22,1,.36,1)}
#pk.on .pks{transform:none}
.pks{touch-action:pan-x}.pkg,.pks h3{touch-action:none}.pkg::before{content:"";position:absolute;inset:-14px -48px}
.pkg{position:relative;display:block;width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.pks h3{margin:0 20px 14px;font-size:15px;font-weight:600}
.pkr{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x proximity;scroll-behavior:smooth;overscroll-behavior-x:contain;padding:4px 20px 8px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.pkr::-webkit-scrollbar{display:none}
.pkc{transform:translateZ(0);flex:none;width:min(260px,72vw);scroll-snap-align:center;border:2px solid var(--line);border-radius:16px;background:var(--bg);padding:14px 12px 12px;display:flex;flex-direction:column;gap:12px;align-items:center;transition:border-color .2s,transform .15s}
.pkc.on{border-color:var(--f)}.pkc:active{transform:scale(.97)}
.pkc b{font-size:14px;font-weight:600}
.pkv{--w:calc(min(260px,72vw) - 28px);width:var(--w);height:calc(var(--w)*.28);display:flex;align-items:center}
.pkv canvas{width:100%;aspect-ratio:25/7;display:block}
#time{transition:transform .3s cubic-bezier(.22,1,.36,1)}
#time.hold{transform:scale(.93);transition:transform .4s cubic-bezier(.3,.7,.2,1) .08s}
#cv,#fxc{transition:opacity .16s ease,transform .22s cubic-bezier(.22,1,.36,1)}
[data-cs=tetris] #cv.tmx{opacity:0;transform:scale(.92);transition-duration:.2s,.2s}
#time.sw #cv,#time.sw #fxc{opacity:0;transform:scale(.92);transition-duration:.09s,.09s}
@media (prefers-reduced-motion:reduce){#time,#time.hold,#cv,#fxc{transition:none}}
</style></head>
<body><div id="app">
<section class="view on" id="vt"><div id="stage"><div class="ring" id="ring" role="button" tabindex="0" aria-label="Start or pause">
<div id="time"><canvas id="cv"></canvas><div class="fxc" id="fxc" aria-hidden="true"></div><span id="lab">Focus</span></div></div></div>
<div id="ctl"><button class="sm" id="rs">Reset</button><button id="go">Start</button><button class="sm" id="sk">Skip</button></div></section>
<section class="view" id="vs"></section>
<section class="view" id="vg">

<script>
const $=s=>document.querySelector(s);
let S={f:25,b:5,goal:4,days:{},ses:{},mode:"f",theme:"dark",cs:"dots",rem:1500,running:false,end:0,seg:0};
try{Object.assign(S,JSON.parse(localStorage.getItem("focus1")||"{}"))}catch(e){}
{const ok=(v,lo)=>Number.isFinite(v)&&v>=lo;if(!ok(S.f,5))S.f=25;if(!ok(S.b,1))S.b=5;if(!ok(S.goal,1))S.goal=4;if(S.mode!=="f"&&S.mode!=="b")S.mode="f";if(!ok(S.rem,1))S.rem=(S.mode==="f"?S.f:S.b)*60;if(S.running&&!Number.isFinite(S.end))S.running=false}
const save=()=>{try{localStorage.setItem("focus1",JSON.stringify(S))}catch(e){}};
const dur=m=>(m==="f"?S.f:S.b)*60;
const key=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const fmt=s=>{const t=Math.round(s/60),h=t/60|0,m=t%60;return h?h+"h "+m+"m":m+"m"};

// icons (Lucide-style, 24px grid)

 coffee:'<path d="M10 2v2"/><path d="M14 2v2"/><path d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1"/><path d="M6 2v2"/>',

 moon:'<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
 sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/>',
 check:'<path d="M20 6 9 17l-5-5"/>',chev:'<path d="m18 15-6-6-6 6"/>',leaf:'<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>',zap:'<path d="M4 14a1 1 0 0 1-.78-1.63l9.9-10.2a.5.5 0 0 1 .86.46l-1.92 6.02A1 1 0 0 0 13 10h7a1 1 0 0 1 .78 1.63l-9.9 10.2a.5.5 0 0 1-.86-.46l1.92-6.02A1 1 0 0 0 11 14z"/>',snow:'<path d="m10 20-1.25-2.5L6 18"/><path d="M10 4 8.75 6.5 6 6"/><path d="m14 20 1.25-2.5L18 18"/><path d="m14 4 1.25 2.5L18 6"/><path d="m17 21-3-6h-4"/><path d="m17 3-3 6 1.5 3"/><path d="M2 12h6.5L10 9"/><path d="m20 10-1.5 2 1.5 2"/><path d="M22 12h-6.5L14 15"/><path d="m4 10 1.5 2L4 14"/><path d="m7 21 3-6-1.5-3"/><path d="m7 3 3 6h4"/>',tree:'<path d="m17 14 3 3.3a1 1 0 0 1-.7 1.7H4.7a1 1 0 0 1-.7-1.7L7 14h-.3a1 1 0 0 1-.7-1.7L9 9h-.2A1 1 0 0 1 8 7.3L12 3l4 4.3a1 1 0 0 1-.8 1.7H15l3 3.3a1 1 0 0 1-.7 1.7H17Z"/><path d="M12 22v-3"/>',
 layers:'<path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/>'};
document.querySelectorAll("[data-ic]").forEach(e=>e.insertAdjacentHTML("afterbegin",`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" width="24" height="24">${IC[e.dataset.ic]}</svg>`));

// haptics: native PremiumHaptics plugin (system haptic effects), navigator.vibrate fallback in browsers
let lh=0;
function hap(t){
 const n=performance.now();if(n-lh<(t==="step"?30:15))return;lh=n;
 try{const P=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.PremiumHaptics;
  if(P)P.play({t});else if(navigator.vibrate)navigator.vibrate(t==="step"?6:10)}catch(e){}}

let ac,wl;
function beep(){try{ac=ac||new AudioContext();[0,.25,.5,1.2,1.45,1.7,2.4,2.65,2.9].forEach(t=>{const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=660;o.connect(g);g.connect(ac.destination);g.gain.setValueAtTime(.2,ac.currentTime+t);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t+.2);o.start(ac.currentTime+t);o.stop(ac.currentTime+t+.2)});navigator.vibrate&&navigator.vibrate([200,100,200,100,200,600,200,100,200,100,200,600,200,100,200,100,200])}catch(e){}}
async function lock(){try{if(S.running&&navigator.wakeLock)wl=await navigator.wakeLock.request("screen")}catch(e){}}
function credit(to){if(S.mode!=="f")return;const ms=Math.max(0,Math.min(to,S.end)-S.seg),k=key();S.days[k]=(S.days[k]||0)+ms/1000}
function pause(){if(!S.running)return;const n=Date.now();credit(n);S.rem=Math.max(1,Math.ceil((S.end-n)/1000));S.running=false;try{wl&&wl.release()}catch(e){}save();render()}
function start(){try{ac=ac||new AudioContext();ac.resume()}catch(e){}const n=Date.now();S.running=true;S.end=n+S.rem*1000;S.seg=n;lock();save();render()}
function swap(){S.mode=S.mode==="f"?"b":"f";S.rem=dur(S.mode)}
function finish(quiet){tetGo.done=Date.now();setTimeout(()=>{if(S.cs==="tetris")draw(draw.n,true)},1450);credit(S.end);if(S.mode==="f"){const k=key();S.ses[k]=(S.ses[k]||0)+1}S.running=false;swap();try{wl&&wl.release()}catch(e){}if(!quiet)beep();save();render()}
function toggle(){hap(S.running?"off":"on");S.running?pause():start()}
$("#ring").onclick=()=>{if(LP){LP=0;return}toggle()};$("#go").onclick=toggle;
$("#rs").onclick=()=>{pause();S.rem=dur(S.mode);save();render()};
$("#sk").onclick=()=>{if(S.mode!=="b")return;pause();swap();save();render()};
// tap anywhere while running pauses (capture phase so it runs before other handlers)
document.addEventListener("click",e=>{if(S.running){e.stopPropagation();hap("off");pause()}},true);

// slide the timer to the exact centre of the screen while running (portrait + landscape)
function center(){
 const r=$("#ring"),b=$("#stage").getBoundingClientRect();
 if(!b.width)return;
 const ls=matchMedia("(orientation:landscape)").matches,q=S.cs==="tetris"?tetLv(tprog()[1],ls):0,hh=q?Math.max(b.width*.14,b.width*q[1]/q[0]/2):b.width*.14,s=ls?Math.max(1,Math.min(innerWidth*.96/b.width,(innerHeight/2-10)/(hh+33))):1,dx=S.running?innerWidth/2-(b.left+b.width/2):0,dy=S.running?innerHeight/2-(b.top+b.height/2):0;
 r.style.setProperty("--hh",hh+"px");r.style.setProperty("--dx",dx+"px");r.style.setProperty("--dy",dy+"px");r.style.setProperty("--s",S.running?s:1);draw.k=s}
let rz,rt;const relayout=()=>{const g=$("#ring");if(S.running){g.classList.add("rot");clearTimeout(rt);rt=setTimeout(()=>g.classList.remove("rot"),350)}center();cancelAnimationFrame(rz);rz=requestAnimationFrame(()=>{center();draw(draw.n,true)})};
matchMedia("(orientation:landscape)").addEventListener("change",()=>{const g=$("#ring");g.classList.add("rot");clearTimeout(rt);rt=setTimeout(()=>g.classList.remove("rot"),700);center()});
["#app","#vt"].forEach(q=>{const e=document.querySelector(q);if(e)new ResizeObserver(()=>{if(S.running)relayout()}).observe(e)});
/* native (Android) pushes system-bar insets here; window stays edge-to-edge so rotation never resizes the WebView */
const insSet=(o,save)=>{const R=document.documentElement;for(const m of["p","l"])if(o[m])["t","b","l","r"].forEach((k,n)=>R.style.setProperty("--sa"+k+"-"+m,Math.max(0,+o[m][n]||0)+"px"));if(save)try{localStorage.setItem("focus-ins2",JSON.stringify(o))}catch(e){}};
window.__ins=(t,b,l,r,land)=>{let o={};try{o=JSON.parse(localStorage.getItem("focus-ins2")||"{}")||{}}catch(e){}o[land?"l":"p"]=[t,b,l,r];insSet(o,1);relayout()};
try{insSet(JSON.parse(localStorage.getItem("focus-ins2")||"{}")||{})}catch(e){}
addEventListener("resize",relayout);addEventListener("orientationchange",()=>setTimeout(relayout,150));

const cv=$("#cv"),cx=cv.getContext("2d");
const GL={"0":"01110,10001,10011,10101,11001,10001,01110","1":"00100,01100,00100,00100,00100,00100,01110","2":"01110,10001,00001,00010,00100,01000,11111","3":"11110,00001,00001,01110,00001,00001,11110","4":"00010,00110,01010,10010,11111,00010,00010","5":"11111,10000,11110,00001,00001,10001,01110","6":"00110,01000,10000,11110,10001,10001,01110","7":"11111,00001,00010,00100,01000,01000,01000","8":"01110,10001,10001,01110,10001,10001,01110","9":"01110,10001,10001,01111,00001,00010,01100",":":"0,0,1,0,1,0,0"};
function dots(c,t,d,on,off){
 const W=c.clientWidth,H=c.clientHeight;if(!W)return;const cx=c.getContext("2d");
 c.width=Math.round(W*d);c.height=Math.round(H*d);cx.setTransform(d,0,0,d,0,0);
 const cp=W/25,p=cp/2.6,r=p*.42;let col=0;
 for(const ch of t){const rows=GL[ch].split(","),w=rows[0].length;
  for(let y=0;y<7;y++)for(let x=0;x<w;x++){cx.fillStyle=rows[y][x]==="1"?on:off;
   for(let i=0;i<2;i++)for(let j=0;j<2;j++){cx.beginPath();cx.arc((col+x)*cp+i*p+p/2,y*cp+j*p+p/2,r,0,6.2832);cx.fill()}}
  col+=w+1}
}
function draw(t,f){
 draw.n=t;
 if(S.cs==="flip"){flip(t,f);return}
 if(S.cs==="tetris"){tetGo(f);return}
 if(!t||(!f&&draw.l===t))return;draw.l=t;
 dots(cv,t,(window.devicePixelRatio||1)*(draw.k||1),DC[0],DC[1]);
}
function render(){
 const r=S.running?Math.max(0,Math.ceil((S.end-Date.now())/1000)):S.rem,d=dur(S.mode);
 const t=String(r/60|0).padStart(2,"0")+":"+String(r%60).padStart(2,"0");
 draw(t);$("#sk").classList.toggle("h",S.mode!=="b");$("#rs").classList.toggle("h",S.running||S.rem>=d);$("#lab").textContent=S.mode==="f"?"Focus":"Break";
 const a=$("#app");a.classList.toggle("running",S.running);a.classList.toggle("paused",!S.running&&S.rem<d);$("#vt").classList.toggle("b",S.mode==="b");
 $("#go").textContent=S.running?"Pause":(S.rem<d?"Resume":"Start");
 document.title=S.running?t+" · "+(S.mode==="f"?"Focus":"Break"):"Focus";
 if(render.r!==S.running){render.r=S.running;center();draw(draw.n,true)}
}
setInterval(()=>{if(S.running){if(S.end<=Date.now())finish();else render()}},250);
document.addEventListener("visibilitychange",()=>{if(!document.hidden){lock();if(S.running&&S.end<=Date.now())finish(true);render()}});

// views
const pill=document.createElement("i");pill.id="pill";$("#nav").prepend(pill);
function place(){const a=document.querySelector("nav button.on");if(!a)return;pill.style.width=a.offsetWidth+"px";pill.style.height=a.offsetHeight+"px";pill.style.transform=`translate(${a.offsetLeft}px,${a.offsetTop}px)`}
place();requestAnimationFrame(()=>{place();pill.classList.add("an")});addEventListener("resize",()=>{pill.classList.remove("an");place();requestAnimationFrame(()=>pill.classList.add("an"))});
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{if(b.classList.contains("on"))return;hap("nav");{const nb=[...document.querySelectorAll("nav button")];document.documentElement.style.setProperty("--dx",(nb.indexOf(b)>nb.findIndex(x=>x.classList.contains("on"))?30:-30)+"px")}document.querySelectorAll("nav button,.view").forEach(e=>e.classList.remove("on"));b.classList.add("on");place();$("#"+b.dataset.v).classList.add("on");if(b.dataset.v==="vs")stats();if(b.dataset.v==="vt")relayout()});
function stats(){
 const k=key(),td=S.days[k]||0,g=S.goal*3600;let rows="",tot=0;
 for(let i=0;i<14;i++){const d=new Date();d.setDate(d.getDate()-i);const s=S.days[key(d)]||0;if(i<7)tot+=s;
  rows+=`<div class="row"><span class="mut">${i?d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"}):"Today"}</span><div class="bar"><i style="width:${Math.min(100,s/g*100)}%"></i></div><span class="t">${s?fmt(s):"–"}</span></div>`}
 $("#vs").innerHTML=`<h2>Today</h2><div class="big">${fmt(td)}</div><div class="bar"><i style="width:${Math.min(100,td/g*100)}%"></i></div><div class="mut">Goal ${S.goal}h · ${S.ses[k]||0} ${S.ses[k]===1?"session":"sessions"}</div>
 <h2 style="margin-top:34px">Last 7 days: ${fmt(tot)} total, ${fmt(tot/7)} per day</h2>${rows}`}

// settings. [input id, state key, min, max, breakpoint step, label, ticks id]
// breakpoints = labelled ticks AND the stronger haptic bump; every other step gets a light tick
const SL=[["gr","goal",1,12,1,v=>v+" h","tg"]];
SL.forEach(([id,k,min,max,bp,f,tid])=>{let h="";
 for(let v=Math.ceil(min/bp)*bp;v<=max;v+=bp)h+=`<i style="--k:${(v-min)/(max-min)}"><b>${v}</b></i>`;
 $("#"+tid).innerHTML=h;
 $("#"+id).oninput=e=>{const el=e.target,v=+el.value;if(v===el.lv)return;el.lv=v;S[k]=v;
  hap(v===min||v===max?"end":v%bp===0?"bp":"step");
  k==="goal"?(save(),sets()):apply()}});
const P=[[25,5],[50,10],[90,20]];
// value text: only the characters that change roll in (up when increasing, down when decreasing)
function setVal(el,t,n){const o=el._t||"",up=n>=(el._n??n);el._t=t;el._n=n;if(o===t)return;
 el.innerHTML=[...t].map((c,i)=>{const p=o[o.length-(t.length-i)],ch=c===" "?"&nbsp;":c;return `<span class="ch${o&&c!==p?" "+(up?"u":"d"):""}">${ch}</span>`}).join("")}
function sets(){
 const ck=S.f+"/"+S.b;if(sets.k!==ck){sets.k=ck;
 $("#chips").innerHTML=P.map((p,i)=>`<button class="chip ${S.f===p[0]&&S.b===p[1]?"on":""}" data-f="${p[0]}" data-b="${p[1]}"><b>${p[0]}/${p[1]}</b></button>`).join("");
 document.querySelectorAll("#chips .chip").forEach(c=>c.onclick=()=>{hap("tap");S.f=+c.dataset.f;S.b=+c.dataset.b;apply()});slider($("#chips"),true)}
 setVal($("#fv"),S.f+" min",S.f);setVal($("#bv"),S.b+" min",S.b);
 SL.forEach(([id,k,min,max,bp,f])=>{const el=$("#"+id);el.value=S[k];el.lv=+el.value;el.style.setProperty("--k",(el.value-min)/(max-min));setVal($("#"+id.replace("r","v")),f(S[k]),S[k])})}
document.querySelectorAll(".bd").forEach(b=>{const w=document.createElement("div");w.className="bi";while(b.firstChild)w.appendChild(b.firstChild);b.appendChild(w)});
document.querySelectorAll(".sb").forEach(b=>{let t,iv,n=0;
 const go=()=>{const k=b.dataset.k,[lo,hi]=k==="f"?[5,120]:[1,30],v=Math.min(hi,Math.max(lo,S[k]+ +b.dataset.d));if(v===S[k]){hap("end");stop();return false}hap("step");S[k]=v;apply();return true};
 const stop=()=>{clearTimeout(t);clearInterval(iv)};
 b.onpointerdown=e=>{e.preventDefault();stop();n=0;if(!go())return;t=setTimeout(()=>{iv=setInterval(()=>{n++;go();if(n===12){clearInterval(iv);iv=setInterval(go,45)}},110)},400)};
 ["pointerup","pointerleave","pointercancel"].forEach(ev=>b.addEventListener(ev,stop));
 b.oncontextmenu=e=>e.preventDefault();
 b.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}}});
document.querySelectorAll(".hd").forEach(h=>h.onclick=()=>{hap("tap");h.parentNode.classList.toggle("cl")});
function apply(){pause();S.rem=dur(S.mode);save();sets();render()}
// theme: dark | light | custom (gruvbox, tokyo, nord, everforest)
const TH=["gruvbox","tokyo","nord","everforest"];
const PAL={dark:["Dark","moon",["#121212","#151515","#353535","#8D8D8D","#E4E4E4","#404040"]],light:["Light","sun",["#ececec","#e0e0e0","#d4d4d4","#5e5e5e","#0d0d0d","#8a8a8a"]],
 custom:["Themes","palette",["#282828","#1a1b26","#2e3440","#2d353b","#fabd2f","#7aa2f7","#88c0d0","#a7c080"],1],
 gruvbox:["Gruvbox","leaf",["#282828","#3c3836","#504945","#a89984","#ebdbb2","#fabd2f"]],tokyo:["Tokyo Night","zap",["#1a1b26","#292e42","#3b4261","#9aa5ce","#c0caf5","#7aa2f7"]],
