name: Build APK
on: [push, workflow_dispatch]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: npm install
      - run: npx cap add android
      - run: sed -i 's|<application|<uses-permission android:name="android.permission.VIBRATE" />\n    <application|' android/app/src/main/AndroidManifest.xml
      - run: sed -i 's|<item name="windowNoTitle">true</item>|&\n        <item name="android:windowBackground">#121212</item>\n        <item name="android:colorBackground">#121212</item>|' android/app/src/main/res/values/styles.xml
      - run: sed -i 's|<style name="AppTheme.NoActionBarLaunch"[^>]*>|&\n        <item name="android:colorBackground">#121212</item>|' android/app/src/main/res/values/styles.xml
      - run: cp native/*.java android/app/src/main/java/com/harman/focus/
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: focus-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
